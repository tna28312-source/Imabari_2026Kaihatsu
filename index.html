<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyTown 観光 & グルメガイド</title>
  <link rel="stylesheet" href="style/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <h1>MyTown 観光 & グルメガイド</h1>
      <nav>
        <ul>
          <li><a href="index.html" class="active">観光スポット</a></li>
          <li><a href="food.html">グルメ</a></li>
          <li><a href="course.html">モデルコース</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h2>おすすめ観光スポット</h2>
      <p>MyTown には歴史と自然が調和した魅力的な場所がたくさんあります。</p>
    </section>

    <section class="card-grid">
      <!-- カード 1 -->
      <article class="card">
        <div class="card-image">
          <img src="https://via.placeholder.com/400x300/4A90E2/fff?text=MyTown+Castle" alt="MyTown 城">
        </div>
        <div class="card-body">
          <h3>MyTown 城</h3>
          <p>江戸時代に建てられた歴史的建造物。天守閣からの眺めは絶景です。</p>
          <a href="https://maps.google.com" target="_blank" class="btn">地図を見る</a>
        </div>
      </article>

      <!-- カード 2 -->
      <article class="card">
        <div class="card-image">
          <img src="https://via.placeholder.com/400x300/50C878/fff?text=Art+Museum" alt="芸術博物館">
        </div>
        <div class="card-body">
          <h3>芸術博物館</h3>
          <p>地元作家の作品を中心に展示するモダンな美術館。企画展も充実。</p>
          <a href="https://maps.google.com" target="_blank" class="btn">地図を見る</a>
        </div>
      </article>

      <!-- カード 3 -->
      <article class="card">
        <div class="card-image">
          <img src="https://via.placeholder.com/400x300/FFD700/fff?text=Central+Park" alt="中央公園">
        </div>
        <div class="card-body">
          <h3>中央公園</h3>
          <p>季節の花が楽しめる広大な公園。ピクニックや散策に最適です。</p>
          <a href="https://maps.google.com" target="_blank" class="btn">地図を見る</a>
        </div>
      </article>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2024 MyTown Guide. All rights reserved.</p>
    </div>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
